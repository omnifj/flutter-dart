# 分析配置：不依赖任何第三方 lint 包，直接使用分析器内置规则
analyzer:
  language:
    # 严格模式：不允许隐式动态类型转换，帮助初学者养成显式类型习惯
    strict-casts: true
    strict-raw-types: true
  errors:
    # 把常见的“坏味道”提升为 warning，保证 flutter analyze 能拦住它们
    unused_import: warning
    dead_code: warning
  exclude:
    - build/**
    - web/**
    - windows/**

linter:
  rules:
    # 下面是一组对初学者友好且不会误报的常用规则
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - constant_identifier_names
    - control_flow_in_finally
    - empty_constructor_bodies
    - no_duplicate_case_values
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - unnecessary_new
    - use_key_in_widget_constructors
