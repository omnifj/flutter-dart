name: flutter_dart
description: Flutter 渐进式学习项目：从 Dart 基础到高级架构的 30 个可交互示例。
publish_to: "none"
version: 1.0.0+1

environment:
  # Dart 3.x 强制空安全；SDK 约束保证示例语法可编译
  sdk: ^3.10.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47+ 起 Material 组件库从 SDK 拆分为官方独立包 material_ui
  # （Flutter 团队第一方包，package:flutter/material.dart 已废弃）
  material_ui: 1.11.0
  # 仅允许的两个第三方包：官方推荐的状态管理与路由方案，版本精确锁定
  provider: 6.1.5+1
  go_router: 18.1.4

dev_dependencies:
  # flutter_test 随 Flutter SDK 分发，不属于第三方包
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
